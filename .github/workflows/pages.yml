name: Deploy LiveTunes to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/gifted-galileo-fbf37r
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages (Actions source) automatically on first run.
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the site (no build step).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
