<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveTunes — Listen Live, Discover Top Hits</title>
  <link rel="preconnect" href="https://itunes.apple.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">🎵</span>
        <span class="brand-name">LiveTunes</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="home">🏠 <span>Home</span></button>
        <button class="nav-item" data-view="live">📻 <span>Live Radio</span></button>
        <button class="nav-item" data-view="english">🇬🇧 <span>English Songs</span></button>
        <button class="nav-item" data-view="mandarin">🇨🇳 <span>Mandarin Songs</span></button>
      </nav>

      <div class="library">
        <div class="library-head">
          <span>❤️ Your Library</span>
          <button id="new-playlist-btn" class="icon-btn" title="New playlist">＋</button>
        </div>
        <div id="library-list" class="library-list"></div>
      </div>

      <div class="sidebar-footer">
        <p>30-second previews powered by the iTunes catalog. Live radio streams from public stations.</p>
      </div>
    </aside>

    <!-- Main content -->
    <main class="content">
      <header class="topbar">
        <h1 id="view-title">Home</h1>
        <div class="topbar-right">
          <button id="theme-btn" class="icon-btn" title="Toggle light/dark theme">🌙</button>
          <div class="search">
            <input id="search-input" type="search" placeholder="Search songs or artists…" />
            <button id="search-btn">Search</button>
          </div>
        </div>
      </header>

      <section id="view" class="view">
        <!-- Views are rendered here by app.js -->
      </section>
    </main>
  </div>

  <!-- Bottom player bar -->
  <footer class="player" id="player">
    <div class="player-track">
      <img id="player-art" class="player-art" alt="" />
      <div class="player-meta">
        <div id="player-title" class="player-title">Nothing playing</div>
        <div id="player-artist" class="player-artist">Pick a song or station</div>
      </div>
      <button id="player-yt" class="icon-btn yt-btn" title="Watch full song on YouTube" hidden>▶️</button>
      <button id="player-fav" class="icon-btn" title="Save to Liked Songs">🤍</button>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button id="prev-btn" class="icon-btn" title="Previous">⏮</button>
        <button id="play-btn" class="play-btn" title="Play/Pause">▶</button>
        <button id="next-btn" class="icon-btn" title="Next">⏭</button>
      </div>
      <div class="progress-row">
        <span id="time-current">0:00</span>
        <input id="seek" class="seek" type="range" min="0" max="100" value="0" />
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div class="player-volume">
      <span id="live-badge" class="live-badge" hidden>● LIVE</span>
      <span>🔊</span>
      <input id="volume" class="volume" type="range" min="0" max="100" value="80" />
    </div>
  </footer>

  <audio id="audio"></audio>

  <!-- Embedded YouTube player (shown only while a YouTube track plays) -->
  <div id="yt-host" class="yt-host" hidden>
    <div class="yt-host-bar">
      <span>▶️ Playing on YouTube</span>
      <button id="yt-close" class="icon-btn" title="Hide video">▾</button>
    </div>
    <div id="yt-player"></div>
  </div>

  <!-- Add-to-playlist popover -->
  <div id="add-menu" class="add-menu" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
